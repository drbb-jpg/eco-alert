plugins { id 'com.android.application' }
def configValue = { key -> '"' + providers.gradleProperty(key).getOrElse('').replace('\\', '\\\\').replace('"', '\\"') + '"' }
android {
    namespace 'com.ecoalert.app'
    compileSdk 36
    defaultConfig {
        applicationId 'com.ecoalert.app'
        minSdk 26
        targetSdk 36
        versionCode 1
        versionName '0.1.0'
        ['API_BASE_URL','FIREBASE_APP_ID','FIREBASE_API_KEY','FIREBASE_PROJECT_ID','FIREBASE_SENDER_ID'].each { key ->
            buildConfigField 'String', key, configValue(key)
        }
    }
    buildFeatures { buildConfig true }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    buildTypes { release { minifyEnabled false } }
}
dependencies {
    implementation platform('com.google.firebase:firebase-bom:33.10.0')
    implementation 'com.google.firebase:firebase-messaging'
    testImplementation 'junit:junit:4.13.2'
}
