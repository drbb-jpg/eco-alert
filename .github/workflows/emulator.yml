name: Test original demo APK on Android
on:
  push:
    branches: [feature/android-calendar]
    paths:
      - '.github/workflows/emulator.yml'
      - 'scripts/smoke_test.py'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - name: Download the original demo APK without rebuilding it
        uses: actions/download-artifact@v4
        with:
          name: eco-alert-demo-apk
          path: original-apk
          run-id: 34865717851
          github-token: ${{ github.token }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Enable emulator hardware acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Exercise installed APK and capture screens
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          ram-size: 2048M
          disk-size: 4096M
          emulator-boot-timeout: 420
          disable-animations: true
          script: python3 scripts/smoke_test.py
      - name: Retain screenshots and test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eco-alert-android-test-results
          path: test-results/
          if-no-files-found: warn
