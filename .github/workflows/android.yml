name: Android and server checks
on:
  push:
    branches: [main, feature/android-calendar]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Build and test Android
        run: gradle :app:testDebugUnitTest :app:assembleDebug :app:bundleRelease :app:lintDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: eco-alert-demo-apk
          path: app/build/outputs/apk/debug/*.apk
      - uses: actions/upload-artifact@v4
        with:
          name: eco-alert-unsigned-aab
          path: app/build/outputs/bundle/release/*.aab
  server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test provider normalization and alert timing
        working-directory: server
        run: npm test
      - name: Validate service syntax
        working-directory: server
        run: node --check src/server.mjs
